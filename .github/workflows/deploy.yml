name: Build and Deploy to Main

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Copy built files to root
        run: |
          cp dist/index.html ./index.html
          rm -rf assets
          cp -r dist/assets ./assets
          # Copy any other public files that vite outputs
          for f in dist/*; do
            fname=$(basename "$f")
            if [[ "$fname" != "assets" && "$fname" != "index.html" ]]; then
              cp -r "$f" "./$fname"
            fi
          done
          touch .nojekyll

      - name: Commit and push built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ .nojekyll -f
          # Add public files (photo, resume PDFs)
          git add srinath-photo.jpg Srinath_S_Resume.pdf Srinath_S_AI_ML_Engineer_Resume.pdf 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: deploy built site [skip ci]"
          git push
